// Game logic and layout use a 384x216 grid; the canvas is 768x432 (SS = 2 device pixels per grid unit),
// so detailed art (hero, teammates, buildings) is drawn on a half-unit grid via hi() / drawHeroHi().
const W = 384, H = 216, SS = 2, CW = W * SS, CH = H * SS;
const cv  = document.getElementById("c");
cv.width = CW; cv.height = CH;
let ctx = cv.getContext("2d", { alpha: false });
const mainCtx = ctx;
const sil = document.createElement("canvas"); sil.width = CW; sil.height = CH;
const silCtx = sil.getContext("2d");
for (const c of [mainCtx, silCtx]) { c.setTransform(SS, 0, 0, SS, 0, 0); c.imageSmoothingEnabled = false; }

function fit() {                      // whole device pixels per canvas pixel keeps the image crisp
  const dpr = window.devicePixelRatio || 1;
  let s = Math.min(window.innerWidth * dpr / CW, window.innerHeight * dpr / CH);
  if (s >= 1) s = Math.floor(s);
  cv.style.width  = (CW * s / dpr) + "px";
  cv.style.height = (CH * s / dpr) + "px";
}
window.addEventListener("resize", fit);
fit();

/* ------------------------------------------------------------- primitives -- */
function rect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function hi(x, y, fn) {            // run fn in a local half-unit pixel grid whose origin is (x, y)
  ctx.save(); ctx.translate(x, y); ctx.scale(0.5, 0.5); fn(); ctx.restore();
}
function frame(x, y, w, h, t, col) { // hollow rect, thickness t
  rect(x, y, w, t, col); rect(x, y + h - t, w, t, col);
  rect(x, y, t, h, col); rect(x + w - t, y, t, h, col);
}

function ell(cx, cy, rx, ry, col) { // filled ellipse
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.round(rx * Math.sqrt(1 - (dy / ry) * (dy / ry)));
    rect(cx - half, cy + dy, half * 2 + 1, 1, col);
  }
}

function textW(str, s) { return str.length ? str.length * 6 * s - s : 0; }

function text(str, x, y, s, col, align, shadow) {
  str = String(str).toUpperCase();
  const w = textW(str, s);
  const X = align === "center" ? Math.round(x - w / 2) : align === "right" ? Math.round(x - w) : Math.round(x);
  const Y = Math.round(y);
  if (shadow) drawRun(str, X + s, Y + s, s, shadow);
  drawRun(str, X, Y, s, col);
}
function drawRun(str, X, Y, s, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]];
    if (g) {
      for (let r = 0; r < 7; r++) {
        const row = g[r];
        for (let c = 0; c < 5; c++) if (row[c] === "#") ctx.fillRect(X + c * s, Y + r * s, s, s);
      }
    }
    X += 6 * s;
  }
}
function wrap(str, maxChars) {
  const words = String(str).toUpperCase().split(/\s+/);
  const out = []; let line = "";
  for (const w of words) {
    if (!line) line = w;
    else if ((line + " " + w).length <= maxChars) line += " " + w;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}

      ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s);

/* ------------------------------------------------------------------ path -- */
const CTRL = [
  [14, 202], [54, 190], [100, 202], [146, 186], [182, 162], [166, 138],
  [122, 126], [130, 104], [180, 96], [238, 104], [286, 118], [316, 104], [332, 88]
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
  ];
}
const PATH = (() => {
  const P = [CTRL[0], ...CTRL, CTRL[CTRL.length - 1]];
  const pts = [];
  for (let i = 0; i < P.length - 3; i++)
    for (let s = 0; s < 24; s++) pts.push(catmull(P[i], P[i + 1], P[i + 2], P[i + 3], s / 24));
  pts.push(CTRL[CTRL.length - 1].slice());
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
})();

function pathAt(t) {
  const d = Math.max(0, Math.min(1, t)) * PATH.len;
  let lo = 0, hi = PATH.cum.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; (PATH.cum[m] <= d ? lo = m : hi = m); }
  const seg = PATH.cum[hi] - PATH.cum[lo] || 1;
  const f = (d - PATH.cum[lo]) / seg;
  const a = PATH.pts[lo], b = PATH.pts[hi];
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, dx: b[0] - a[0], dy: b[1] - a[1] };
}

const STOPS = CONFIG.stops.map((s, i) => {
  const t = (i + 1) / CONFIG.stops.length;
  const p = pathAt(t);
  return Object.assign({}, s, {   // normalise the short config fields into what the engine reads
    label: s.title, rewards: [].concat(s.reward || []).map(r => (typeof r === "string" ? { gear: r } : r)),

    t, x: p.x, y: p.y, index: i

});

let _seed = 20251006;
function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }

const HORIZON = 72;
const POND = { x: 318, y: 176, rx: 30, ry: 9 };
function nearRoad(x, y, d) {
  for (let i = 0; i < PATH.pts.length; i += 2) {
    const p = PATH.pts[i];
    if (Math.abs(p[0] - x) < d && Math.abs(p[1] - y) < d) return true;
  }
  return false;
}
function blocked(x, y) {
  if (x > 288 && y < 112) return true;                       // castle hill
  if (Math.abs(x - POND.x) < POND.rx + 6 && Math.abs(y - POND.y) < POND.ry + 12) return true;
  return STOPS.some(s => s.art && x > s.lx - LAND[s.art].l - 8 && x < s.lx + LAND[s.art].r + 8 &&
                         y > s.ly - LAND[s.art].h - 4 && y < s.ly + 10);
}
const TREES = (() => {
  const out = [];
  for (let i = 0; i < 400 && out.length < 28; i++) {
    const x = 8 + rnd() * 368, y = HORIZON + 6 + rnd() * 136;
    if (nearRoad(x, y, 17) || blocked(x, y)) continue;
    if (out.some(o => Math.abs(o.x - x) < 20 && Math.abs(o.y - y) < 14)) continue;
    out.push({ x: Math.round(x), y: Math.round(y), big: rnd() > 0.55, pine: rnd() > 0.5 });
  }
  return out.sort((a, b) => a.y - b.y);
})();
const PROPS = (() => {          // bushes + rocks, depth-sorted with everything else
  const out = [];
  for (let i = 0; i < 300 && out.length < 22; i++) {
    const x = 6 + rnd() * 372, y = HORIZON + 8 + rnd() * 134, k = rnd() > 0.35 ? "bush" : "rock";
    if (nearRoad(x, y, 10) || blocked(x, y)) continue;
    out.push({ x: Math.round(x), y: Math.round(y), kind: k });
  }
  return out;
})();
const GROUND_DECOR = (() => {   // flat details: grass tufts + flowers
  const out = [], fl = ["#ffffff", "#ffd95e", "#ff7a93", "#b69cff"];
  for (let i = 0; i < 700 && out.length < 170; i++) {
    const x = 3 + rnd() * 378, y = HORIZON + 5 + rnd() * 136, flower = rnd() > 0.62;
    if (nearRoad(x, y, 9) || blocked(x, y)) continue;
    out.push({ x: Math.round(x), y: Math.round(y), flower, col: fl[(rnd() * fl.length) | 0] });
  }
  return out;
})();

function reset() {
  state = S.TITLE; idx = 0; heroT = 0; heroDir = 1; won = {}; revealed = {};
  walk = null; card = null; parts = []; flash = 0;

function earned() {
  const set = new Set();
  for (let i = 0; i < idx; i++) {
    if (STOPS[i].battle && !won[i]) continue;
    const drops = card && card.i === i && card.phase === 2 && STOPS[i].battle ? dropSchedule(STOPS[i]) : null;
    STOPS[i].gears.forEach(k => {      // while a win is playing out, items join the inventory as they land
      const r = drops && drops.find(d => d.gear === k);
      if (!(r && card.t < r.at + 0.5)) set.add(k);
    });
  }
  return set;
}

function mates() {   // teammates earned so far, in joining order
  const out = [];
  for (let i = 0; i < idx; i++)
    if (STOPS[i].team && won[i]) for (let k = 0; k < STOPS[i].team; k++) out.push(MATE_STYLES[out.length % MATE_STYLES.length]);
  return out;
}

function startWalk(targetIdx, back) {
  const from = heroT;
  const to = targetIdx < 0 ? 0 : STOPS[targetIdx].t;
  heroDir = to >= from ? 1 : -1;
  const dist = Math.abs(to - from) * PATH.len;
  walk = { from, to, t: 0, dur: Math.max(0.45, dist / 52), back: !!back, target: targetIdx };
  state = S.WALK;
}
function isMystery(st) { return !!st.mystery && !revealed[st.index]; }
function labelOf(st) { return isMystery(st) ? "???" : st.mystery ? st.mystery.label : st.label; }
function titleOf(st) { return !isMystery(st) && st.mystery ? st.mystery.title : st.title; }
function revealStop(i) {
  const st = STOPS[i];
  revealed[i] = true; flash = 0.3;
  burst(st.lx, st.ly - 22, "#ffffff", 22); burst(st.lx, st.ly - 22, "#f2b705", 12);
}

function openCard(i) {
  const st = STOPS[i];
  revealed[i] = true;
  card = { i: i, anim: 0, t: 0, phase: st.battle && !won[i] ? 0 : 2 };   // battle phases: 0 intro, 1 fight, 2 won
  state = S.CARD;
  if (st.gears.length && !st.battle) burst(st.x, st.y - 6, "#f2b705", 14);
}
function winBattle() {
  card.phase = 2; card.t = 0; won[card.i] = true; flash = 0.35;
  burst(W / 2 + 80, H / 2 - 10, "#f2b705", 26); burst(W / 2 + 80, H / 2 - 10, "#ffffff", 16);
}
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, sp = 14 + rnd() * 34;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 22, life: 0.7 + rnd() * 0.5, col, g: 70 });
  }
}
function confetti() {
  const cols = ["#d2051e", "#ffffff", "#f2b705", "#2f6fd0"];
  for (let i = 0; i < 70; i++)
    parts.push({
      x: rnd() * W, y: -4 - rnd() * 60, vx: (rnd() - 0.5) * 20, vy: 24 + rnd() * 40,
      life: 3 + rnd() * 2, col: cols[(rnd() * cols.length) | 0], g: 6
    });
}

/* ----------------------------------------------------------------- input -- */
function advance() {
  if (state === S.TITLE) { state = S.MAP; return; }
  if (state === S.MAP) {
    const pi = idx - 1;
    if (pi >= 0 && STOPS[pi].battle && !won[pi]) openCard(pi);     // unfinished boss fight blocks the road
    else if (idx < STOPS.length) startWalk(idx);
    else { state = S.END; confetti(); }
    return;
  }
  if (state === S.WALK) { walk.t = walk.dur; return; }
  if (state === S.CARD) {
    const bt = STOPS[card.i].battle;
    if (bt && card.phase === 0) { card.phase = 1; card.t = 0; return; }
    if (bt && card.phase === 1) { winBattle(); return; }
    const done = card.i === STOPS.length - 1;
    card = null;
    if (done) { state = S.END; confetti(); flash = 0.5; } else state = S.MAP;
    return;
  }
}
function goBack() {
  if (state === S.CARD) { card = null; state = S.MAP; return; }
  if (state === S.END) { state = S.MAP; parts.length = 0; return; }
  if (state === S.WALK) { walk.t = walk.dur; return; }
  if (state === S.MAP && idx > 0) { idx--; startWalk(idx - 1, true); return; }
  if (state === S.MAP && idx === 0) state = S.TITLE;
}
function reopen() {
  if (state === S.MAP && idx < STOPS.length && isMystery(STOPS[idx])) { revealStop(idx); return; }
  if ((state === S.MAP || state === S.END) && idx > 0) openCard(idx - 1);
}

addEventListener("keydown", e => {
  const k = e.key;
  if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); advance(); }
  else if (k === "b" || k === "B" || k === "Backspace" || k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); goBack(); }
  else if (k === "Enter" || k === "ArrowUp") { e.preventDefault(); reopen(); }
  else if (k === "r" || k === "R") { reset(); }
  else if (k === "f" || k === "F") {
    const el = document.getElementById("wrap");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }
});
cv.addEventListener("mousedown", () => advance());

const hit = (a, b, m) => a[0] - m < b[0] + b[2] && a[0] + a[2] + m > b[0] && a[1] - m < b[1] + b[3] && a[1] + a[3] + m > b[1];
const ROAD_BLOCKS = (() => {                   // road + the head-room the hero and teammates occupy above it
  const out = [];
  for (let i = 0; i < PATH.pts.length; i += 2) {
    const q = PATH.pts[i], w = ROADW(q[1]);
    out.push([q[0] - w - 4, q[1] - 19, 2 * w + 9, 19 + w + 5]);

  return out;
})();
function staticBlocks() {                      // everything a sign must stay off, besides other signs
  const r = [[3, 2, 104, 26], [166, 2, 52, 18], [HINT_BAR.x - 1, HINT_BAR.y - 1, HINT_BAR.w + 2, HINT_BAR.h + 2],
             [196, H - 44, W - 196, 44], [296, 24, 84, 74],
             [POND.x - POND.rx - 1, POND.y - POND.ry - 1, 2 * POND.rx + 3, 2 * POND.ry + 5], [0, 178, 28, 30]];
  for (const st of STOPS) {
    r.push([st.x - 10, st.y - 30, 30, 34]);    // hero (+ club) standing at the stop
    if (st.art) {
      const L = LAND[st.art];
      r.push([st.lx - L.l - 2, st.ly - L.h - 4, L.l + L.r + 4, L.h + 9], [st.lx - 11, st.ly - L.h - 38, 22, 34]);
    }
  }
  return r;
}
let signSet = null, signKey = "";
function layoutSigns() {                       // choose a spot for every label: free of obstacles, as close to its stop as possible
  const items = [{ text: CONFIG.startLabel, x: pathAt(0).x, y: pathAt(0).y }]
    .concat(STOPS.map(st => ({ text: labelOf(st), x: st.x, y: st.y, badge: true })));
  const blocks = staticBlocks();
  const per = items.map(it => {                // best statically-free candidates for this label, nearest first
    const lines = wrap(it.text, 14), w = Math.max(...lines.map(l => textW(l, 1))) + 8, h = 6 + 8 * lines.length - 1;
    const eh = it.badge ? 11 : 0, cand = [];     // eh: room for the status tab on top
    for (let dx = -190; dx <= 190; dx += 3) for (let dy = -130; dy <= 130; dy += 3) {
      const r = [Math.round(it.x + dx - w / 2), Math.round(it.y + dy - h / 2), w, h];
      if (r[0] < 3 || r[1] - eh < 3 || r[0] + w > W - 3 || r[1] + h + 4 > H - 3) continue;
      cand.push({ r, e: [r[0], r[1] - eh, w, h + eh], score: Math.hypot(dx, dy * 1.2) + (dy < 0 ? 6 : 0) });
    }
    cand.sort((a, b) => a.score - b.score);
    const free = [];
    for (const c of cand) {
      if (!blocks.some(b => hit(c.e, b, 1)) && !ROAD_BLOCKS.some(b => hit(c.e, b, 1))) free.push(c);
      if (free.length >= 350) break;
    }
    return { lines, badge: it.badge, px: it.x, py: it.y, free: free.length ? free : cand.slice(0, 1) };
  });
  const n = per.length;
  const tryOrder = order => {                  // place greedily in this order; signs may not touch each other
    const placed = [], pick = [];
    let total = 0;
    for (const i of order) {
      const c = per[i].free.find(c => !placed.some(b => hit(c.e, b, 2)));
      total += c ? c.score : 1e4;
      const use = c || per[i].free[0];
      placed.push(use.e); pick[i] = use;
    }
    return { total, pick };
  };
  let best = null;
  const perm = (arr, k) => {                   // every placement order (n! is small)
    if (k === arr.length) { const t = tryOrder(arr); if (!best || t.total < best.total) best = t; return; }
    for (let i = k; i < arr.length; i++) { [arr[k], arr[i]] = [arr[i], arr[k]]; perm(arr, k + 1); [arr[k], arr[i]] = [arr[i], arr[k]]; }
  };
  perm([...Array(n).keys()], 0);
  return per.map((p, i) => ({ lines: p.lines, r: best.pick[i].r, px: p.px, py: p.py, badge: p.badge }));
}

  });
}

function cone(cx, yBase, wBase, hh, a, b) {      // pointed roof, narrowing to the top
  for (let r = 0; r < hh; r++) {
    const w = Math.max(2, Math.round(wBase * (1 - r / hh)));
    rect(cx - (w >> 1), yBase - r, w, 1, r % 3 === 2 ? b : a);
    rect(cx - (w >> 1), yBase - r, Math.max(1, w >> 2), 1, "rgba(255,255,255,0.14)");
  }
}

function lancet(cx, yb, w, h, col) {   // pointed (gothic) arch shape: straight sides below, pointed top; base at yb
  const rise = Math.min(h, Math.round(w * 0.95));
  rect(cx - (w >> 1), yb - h + rise, w, h - rise, col);
  for (let r = 0; r < rise; r++) {
    const half = Math.max(0, Math.round((w / 2) * (1 - Math.pow((r + 0.5) / rise, 1.4))));
    rect(cx - half, yb - h + rise - 1 - r, half * 2 + (w % 2), 1, col);
  }
}

  for (const s of list) rect(flip ? bw - s[0] - s[2] : s[0], s[1], s[2], s[3], PAL[s[4]] || s[4]);

function pix(rows, x, y, bw, flip) {   // pixel-art rows of PAL letters, drawn as merged runs
  const w = rows[0].length;
  rows.forEach((row, r) => {

      if (PAL[row[c]]) rect(flip ? bw - (x + c + n) : x + c, y + r, n, 1, PAL[row[c]]);
      c += n;
    }
  });
}

function drawCard() {
  const st = STOPS[card.i];
  const a = Math.min(1, card.anim / 0.14);
  ctx.fillStyle = "rgba(10,8,18," + (0.74 * a).toFixed(3) + ")";
  ctx.fillRect(0, 0, W, H);

  const fw = 316, fh = 156;
  const w = Math.round(fw * (0.86 + 0.14 * a)), h = Math.round(fh * (0.86 + 0.14 * a));
  const x = Math.round(W / 2 - w / 2), y = Math.round(H / 2 - h / 2);
  if (a < 1) { frame(x, y, w, h, 2, "#ffffff"); return; }

  rect(x + 3, y + 4, w, h, "rgba(0,0,0,0.45)");
  rect(x, y, w, h, "#17142a");
  frame(x, y, w, h, 2, "#ffffff");
  rect(x + 2, y + 2, w - 4, 22, "#d2051e");
  rect(x + 2, y + 2, w - 4, 2, "#ff3348");
  rect(x + 2, y + 22, w - 4, 2, "#8e0313");

  const title = titleOf(st), ts = textW(title, 2) > w - 70 ? 1 : 2;
  text(title, x + 10, y + (ts === 2 ? 7 : 11), ts, "#ffffff", "left", "#8e0313");
  text((card.i + 1) + "/" + STOPS.length, x + w - 10, y + 10, 1, "#ffd3d7", "right");

  if (st.battle) { drawBattleBody(st, x, y, w, h); return; }

  let ty = y + 36;
  for (const raw of st.lines) {
    for (const line of wrap(raw, 23)) {
      rect(x + 12, ty + 4, 4, 4, "#f2b705");
      text(line, x + 20, ty, 2, "#f3f1ff", "left", "#000000");
      ty += 20;
    }
    ty += 2;
  }

  rewardRows(st.gears, x, y + h - 12 - st.gears.length * 14, w);
  promptTag(CONFIG.ui.promptNext, x + w - 10, y + h - 11, 1);
}

  rect(x + 10, ry, w - 20, 12, "rgba(242,183,5,0.14)"); frame(x + 10, ry, w - 20, 12, 1, "#f2b705");
  iconAt(k, x + 12, ry, 12, 12);

}
function rewardRows(gears, x, y0, w) { gears.forEach((k, i) => rewardRow(k, x, y0 + i * 14, w)); }
function noteRow(note, x, ry, w) {          // short card line announced before its item drops

}
function dropSchedule(st) {                 // when each reward starts falling (seconds after the win)
  let at = 0;
  return st.rewards.map((r, i) => {
    if (i) at += 0.5 + (r.note ? 0.9 : 0) - (r.note ? 0 : 0.1);   // plain items follow 0.4s apart; noted items wait for their line
    return { gear: r.gear, note: r.note, at };
  });
}

function drawParty(px, py, s, hop, drops) {   // hero + her teammates standing side by side, drawn big for cards
  const g = earned(), up = hop ? Math.round(Math.abs(Math.sin(timeNow * 11)) * 3) : 0;
  const ox = px + 4 * s, oy = py - up, q = s / 2;     // q = grid units per hi-px
  const falling = k => !!(drops && drops.some(d => d.gear === k && d.p < 1));
  const skip = {}; for (const k of GEAR_KEYS) skip[k] = falling(k);
  drawHeroHi(ox, oy, s, true, false, 0, g, skip);
  (drops || []).forEach(d => {               // rewards fall onto the hero, one after another
    if (d.p <= 0 || d.p >= 1) return;
    const sp = HERO_SPOT[d.gear] || [12, 18];
    spr(GEAR_ICON[d.gear], Math.round(ox + sp[0] * q), Math.round(oy + sp[1] * q - (1 - d.p * d.p) * 70), s);
  });
  let mx = ox + 17 * s;
  mates().forEach((style, k) => {
    const b = hop ? Math.round(Math.abs(Math.sin(timeNow * 11 + k * 1.6)) * 3) : 0;
    drawMateHi(mx, py + 4 * s - b, s, true, false, 0, style, k);
    mx += 12 * s;
  });
}

    ty += 4;
    for (const l of wrap(b.challenge, 36)) { text(l, x + 12, ty, 1, "#cfcbe6", "left"); ty += 10; }
    const bk = b.sprite || "ball", sc = BOSS_SCALE[bk] || 4, bs = BOSS_SPRITES[bk], cx = x + w - 46;
    let bx = cx - 6 * sc, by = y + 26 + (48 - 12 * sc) + Math.round(Math.sin(timeNow * 3) * 2);
    if (c.phase === 1) bx += Math.round(Math.sin(c.t * 60) * 3);
    ell(cx, y + 76, 18, 2, "rgba(0,0,0,0.35)");
    if (!(c.phase === 1 && c.t > 0.8 && Math.sin(c.t * 50) > 0)) {
      spr(bs, bx, by, sc);
      if (c.phase === 1 && Math.sin(c.t * 40) > 0.3) spr(bs, bx, by, sc, false, "#ffffff");
    }
    drawParty(x + w - 96, y + 74, 2, c.phase === 1);
    if (b.weapon) {                          // the hero's weapon: held up, then thrown at the boss
      const wx = x + w - 84, wy = y + 56, tx = cx - 7, ty2 = y + 44;
      if (c.phase === 0) spr(GEAR_ICON[b.weapon], wx, wy + Math.round(Math.sin(timeNow * 3)), 2);
      else for (let k = 0; k < 2; k++) {
        const p = (c.t * 2.5 + k / 2) % 1;
        if (p < 0.92) spr(GEAR_ICON[b.weapon], Math.round(wx + (tx - wx) * p), Math.round(wy + (ty2 - wy) * p - Math.sin(p * Math.PI) * 8), 2);
      }
    }
    const lines = wrap(CONFIG.ui.loot + ": " + b.powerUp, 42), bh = 10 + lines.length * 10, py = y + h - 12 - bh;
    rect(x + 10, py, bw, bh, "rgba(242,183,5,0.14)"); frame(x + 10, py, bw, bh, 1, "#f2b705");
    const pi = st.gears[0];
    if (pi) iconAt(pi, x + 12, py, 14, bh);
    lines.forEach((l, j) => text(l, x + 30, py + 7 + j * 10, 1, "#ffd95e", "left"));
    if (c.phase === 0) promptTag(CONFIG.ui.promptFight, x + w - 10, y + h - 11, 1);
    return;
  }
  text(CONFIG.ui.victory, x + 12, y + 30, 3, "#ffd95e", "left", "#8a6a00");
  let ty = y + 58;                           // the loot line, small, under VICTORY!
  for (const l of wrap(st.loot, 34)) { text(l, x + 12, ty, 1, "#f3f1ff", "left", "#000000"); ty += 10; }
  const sch = dropSchedule(st);
  drawParty(x + w - 96, y + 27, 2, true, sch.map(r => ({ gear: r.gear, p: Math.max(0, Math.min(1, (c.t - r.at) / 0.5)) })));
  let ry = ty + 4;
  sch.forEach(r => {
    if (r.note) { if (c.t >= r.at - 0.9) noteRow(r.note, x, ry, w); ry += 14; }
    if (c.t >= r.at + 0.5) rewardRow(r.gear, x, ry, w);
    ry += 14;
  });
  if (st.team && c.t >= sch[sch.length - 1].at + 0.5) {
    rect(x + 10, ry, bw, 12, "rgba(47,111,208,0.18)"); frame(x + 10, ry, bw, 12, 1, "#6fa3ff");
    text(st.team + " " + CONFIG.ui.joined, x + 16, ry + 3, 1, "#bcd6ff", "left");
  }
  promptTag(CONFIG.ui.promptNext, x + w - 10, y + h - 11, 1);
}

/* ----------------------------------------------------------------- scenes -- */
function drawTitle() {
  drawSky(); drawGround(); drawRoad();
  for (const t of TREES) drawTree(t.x, t.y, t.big, t.pine);
  for (const o of PROPS) drawProp(o);
  drawCastle(300, 150);
  drawHero(70, 180, true, false, 0);
  ctx.fillStyle = "rgba(10,8,18,0.55)"; ctx.fillRect(0, 0, W, H);
  drawHintBar();

  text(CONFIG.title, W / 2, 46, 4, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 80, 82, 160, 2, "#d2051e");
  text(CONFIG.subtitle, W / 2, 92, 1, "#ffd3d7", "center", "#1b1426");
  if (CONFIG.byline) text(CONFIG.byline, W / 2, 108, 1, "rgba(255,255,255,0.6)", "center", "#1b1426");

  // gear showcase
  GEAR_KEYS.forEach((k, i) => {
    const x = W / 2 - 92 + i * 28, y = 132;
    rect(x - 2, y - 2, 20, 22, "rgba(255,255,255,0.10)");
    frame(x - 2, y - 2, 20, 22, 1, "rgba(255,255,255,0.35)");
    iconAt(k, x - 2, y - 2, 20, 22);
  });

  if (Math.sin(timeNow * 4) > -0.35)
    text(CONFIG.pressStart, W / 2, 180, 2, "#ffffff", "center", "#1b1426");
}

function drawMapScene() {
  drawSky(); drawGround(); drawRoad();
  drawStartMarker();

  const items = [];
  for (const t of TREES) items.push({ y: t.y, f: () => drawTree(t.x, t.y, t.big, t.pine) });
  for (const o of PROPS) items.push({ y: o.y, f: () => drawProp(o) });
  items.push({ y: 86, f: () => drawCastle(332, 90) });
  STOPS.forEach((st, i) => {
    const status = i < idx ? "done" : i === idx ? (state === S.WALK && !walk.back ? "locked" : "next") : "locked";
    items.push({ y: st.y + (st.isCastle ? 0.7 : 0.5), f: () => drawStopNode(st, status, timeNow) });
    if (st.art) items.push({ y: st.ly + 0.5, f: () => drawLandmark(st, status, timeNow) });
  });
  const hp = pathAt(heroT);
  const moving = state === S.WALK;
  const dir = moving ? (walk.to >= walk.from ? 1 : -1) : 1;
  const right = moving ? (hp.dx * dir >= 0) : true;
  items.push({ y: hp.y + 0.6, f: () => drawHero(hp.x, hp.y, right, moving, timeNow) });
  mates().forEach((style, k) => {
    const t = Math.max(0, Math.min(1, heroT - heroDir * (14 * (k + 1)) / PATH.len)), mp = pathAt(t);
    items.push({ y: mp.y + 0.5, f: () => drawMate(mp.x, mp.y, heroDir * mp.dx >= 0, moving, timeNow, style, k) });
  });
  items.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawSigns();

  drawParticles();
  drawHud();
  drawHintBar();

  if (state === S.MAP) {
    const label = idx >= STOPS.length ? "FINISH" : "SPACE";
    promptTag(label, W - 8, H - 14, 1);
    if (idx < STOPS.length && isMystery(STOPS[idx]))
      text("ENTER: REVEAL", W - 10, H - 38, 1, "#ffd95e", "right", "#1b1426");
    if (idx < STOPS.length)
      text("NEXT: " + labelOf(STOPS[idx]), W - 10, H - 26, 1, "rgba(255,255,255,0.75)", "right", "#1b1426");
  }
}

function drawEnd() {
  drawMapScene();
  ctx.fillStyle = "rgba(10,8,18,0.62)"; ctx.fillRect(0, 0, W, H);
  text(CONFIG.endTitle, W / 2, 56, 3, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 70, 86, 140, 2, "#d2051e");
  let y = 98;
  for (const raw of CONFIG.endLines)
    for (const l of wrap(raw, 26)) { text(l, W / 2, y, 2, "#f3f1ff", "center", "#000000"); y += 20; }
  GEAR_KEYS.forEach((k, i) => {
    const x = W / 2 - 92 + i * 28, yy = 142;
    rect(x - 2, yy - 2, 20, 22, "rgba(255,255,255,0.12)");
    frame(x - 2, yy - 2, 20, 22, 1, "#f2b705");
    iconAt(k, x - 2, yy - 2, 20, 22);
  });
  if (Math.sin(timeNow * 3) > -0.4)
    text(CONFIG.endPrompt, W / 2, 180, 2, "#ffd95e", "center", "#1b1426");
}

function drawParticles() {
  for (const p of parts) rect(p.x, p.y, 2, 2, p.col);
}

/* ------------------------------------------------------------------ loop -- */
let last = performance.now();
function tick(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  timeNow += dt;

  if (state === S.WALK) {
    walk.t += dt;
    const k = Math.min(1, walk.t / walk.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    heroT = walk.from + (walk.to - walk.from) * e;
    if (k >= 1) {
      heroT = walk.to;
      if (walk.back) { state = S.MAP; walk = null; }
      else {
        const i = walk.target; walk = null;
        idx = i + 1; flash = 0.22;
        burst(STOPS[i].x, STOPS[i].y - 10, "#cdd3de", 10);
        openCard(i);
      }
    }
  }
  if (card) card.anim += dt;
  if (card) { card.t += dt; if (card.phase === 1 && card.t >= 1.1) winBattle(); }
  if (flash > 0) flash -= dt;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    if (p.life <= 0 || p.y > H + 6) parts.splice(i, 1);
  }

  if (state === S.TITLE) drawTitle();
  else if (state === S.END) drawEnd();
  else { drawMapScene(); if (state === S.CARD) { drawCard(); drawParticles(); } }

  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.5, flash * 1.6).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
