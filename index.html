/* ---------------------------------------------------------------- canvas -- */
const W = 384, H = 216;
const cv  = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.max(1, Math.min(window.innerWidth / W, window.innerHeight / H));
  cv.style.width  = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

/* ------------------------------------------------------------- primitives -- */
function rect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function frame(x, y, w, h, t, col) { // hollow rect, thickness t
  rect(x, y, w, t, col); rect(x, y + h - t, w, t, col);
  rect(x, y, t, h, col); rect(x + w - t, y, t, h, col);
}

/* --------------------------------------------------------------- 5x7 font -- */
const FONT_KEYS = ["ABCDEFGHI", "JKLMNOPQR", "STUVWXYZ0", "123456789", ".,!?'-:()", "/&+\"%"];
const FONT_ART = [
`.###. ####. .###. ####. ##### ##### .###. #...# #####
#...# #...# #...# #...# #.... #.... #...# #...# ..#..
#...# #...# #.... #...# #.... #.... #.... #...# ..#..
##### ####. #.... #...# ####. ####. #.### ##### ..#..
#...# #...# #.... #...# #.... #.... #...# #...# ..#..
#...# #...# #...# #...# #.... #.... #...# #...# ..#..
#...# ####. .###. ####. ##### #.... .###. #...# #####`,

`...## #...# #.... #...# #...# .###. ####. .###. ####.
....# #..#. #.... ##.## ##..# #...# #...# #...# #...#
....# #.#.. #.... #.#.# ##..# #...# #...# #...# #...#
....# ##... #.... #.#.# #.#.# #...# ####. #...# ####.
#...# #.#.. #.... #...# #..## #...# #.... #.#.# #.#..
#...# #..#. #.... #...# #..## #...# #.... #..#. #..#.
.###. #...# ##### #...# #...# .###. #.... .##.# #...#`,

`.#### ##### #...# #...# #...# #...# #...# ##### .###.
#.... ..#.. #...# #...# #...# #...# #...# ....# #...#
#.... ..#.. #...# #...# #...# .#.#. .#.#. ...#. #..##
.###. ..#.. #...# #...# #.#.# ..#.. ..#.. ..#.. #.#.#
....# ..#.. #...# #...# #.#.# .#.#. ..#.. .#... ##..#
....# ..#.. #...# .#.#. ##.## #...# ..#.. #.... #...#
####. ..#.. .###. ..#.. #...# #...# ..#.. ##### .###.`,

`..#.. .###. ##### ...#. ##### ..##. ##### .###. .###.
.##.. #...# ...#. ..##. #.... .#... ....# #...# #...#
..#.. ....# ..##. .#.#. ####. #.... ...#. #...# #...#
..#.. ...#. ....# #..#. ....# ####. ..#.. .###. .####
..#.. ..#.. ....# ##### ....# #...# .#... #...# ....#
..#.. .#... #...# ...#. #...# #...# .#... #...# ...#.
.###. ##### .###. ...#. .###. .###. .#... .###. .##..`,

`..... ..... ..#.. .###. ..#.. ..... ..... ...#. .#...
..... ..... ..#.. #...# ..#.. ..... .##.. ..#.. ..#..
..... ..... ..#.. ....# ..... ..... .##.. .#... ...#.
..... ..... ..#.. ...#. ..... ##### ..... .#... ...#.
..... .##.. ..#.. ..#.. ..... ..... .##.. .#... ...#.
.##.. .##.. ..... ..... ..... ..... .##.. ..#.. ..#..
.##.. .#... ..#.. ..#.. ..... ..... ..... ...#. .#...`,

`....# .##.. ..... .#.#. #...#
....# #..#. ..#.. .#.#. ....#

.#... #.#.# ..#.. ..... .#...
#.... #..#. ..#.. ..... #....
#.... .##.# ..... ..... #...#`
];

const FONT = {};
FONT_ART.forEach((block, bi) => {
  const lines = block.split("\n").map(l => l.split(" "));
  FONT_KEYS[bi].split("").forEach((ch, gi) => {
    FONT[ch] = lines.map(row => row[gi]);
  });
});

function textW(str, s) { return str.length ? str.length * 6 * s - s : 0; }

function text(str, x, y, s, col, align, shadow) {
  str = String(str).toUpperCase();
  const w = textW(str, s);
  const X = align === "center" ? Math.round(x - w / 2) : align === "right" ? Math.round(x - w) : Math.round(x);
  const Y = Math.round(y);
  if (shadow) drawRun(str, X + s, Y + s, s, shadow);
  drawRun(str, X, Y, s, col);
}
function drawRun(str, X, Y, s, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]];
    if (g) {
      for (let r = 0; r < 7; r++) {
        const row = g[r];
        for (let c = 0; c < 5; c++) if (row[c] === "#") ctx.fillRect(X + c * s, Y + r * s, s, s);
      }
    }
    X += 6 * s;
  }
}
function wrap(str, maxChars) {
  const words = String(str).toUpperCase().split(/\s+/);
  const out = []; let line = "";
  for (const w of words) {
    if (!line) line = w;
    else if ((line + " " + w).length <= maxChars) line += " " + w;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}

/* --------------------------------------------------------------- sprites -- */
const PAL = {
  ".": null,
  k: "#1b1426", w: "#ffffff", r: "#d2051e", d: "#8e0313",
  s: "#f2c396", h: "#5a3a22", b: "#2f6fd0", p: "#2b3550", o: "#4a3322",
  g: "#9aa0b0", y: "#cdd3de", n: "#6b7280", e: "#f2b705", t: "#7a5a3a"
};
function spr(rows, x, y, s, flip, tint) {
  s = s || 1;
  const hgt = rows.length, wid = rows[0].length;
  for (let r = 0; r < hgt; r++) {
    for (let c = 0; c < wid; c++) {
      const col = PAL[rows[r][flip ? wid - 1 - c : c]];
      if (!col) continue;
      ctx.fillStyle = tint || col;
      ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s);
    }
  }
}

const HERO_TOP = [
  "..kkkk..",
  ".khhhhk.",
  ".kssssk.",
  ".kksskk.",
  ".kssssk.",
  "..ssss..",
  "kkbbbbkk",
  "ksbbbbsk",
  "ksbbbbsk",
  ".kbbbbk."
];
const HERO_LEGS_A = [".kppppk.", ".kp..pk.", ".oo..oo."];
const HERO_LEGS_B = [".kppppk.", "kpp..ppk", "oo....oo"];

const SPR_HAT    = ["..rrrr..", ".rrrrrr.", "rrrrrrrr"];
const SPR_SHIELD = ["rrrrr", "rwwwr", "rwwwr", ".rwr.", ".rrr.", "..r.."];
const SPR_CLUB   = ["...k", "...k", "..k.", "..k.", ".k..", ".k..", "ww..", "ww.."];
const SPR_LOCK   = [".gggg.", ".g..g.", ".g..g.", "yyyyyy", "yyyyyy", "yykkyy", "yyykyy", "yyyyyy"];
const SPR_CHECK  = ["......w", ".....ww", "w...ww.", "ww.ww..", ".www...", "..w...."];

const GEAR_ICON = { club: SPR_CLUB, shield: SPR_SHIELD, hat: SPR_HAT };

/* ------------------------------------------------------------------ path -- */
const CTRL = [
  [14, 202], [54, 190], [100, 202], [146, 186], [182, 162], [166, 138],
  [122, 126], [130, 104], [180, 96], [238, 104], [286, 118], [316, 104], [332, 88]
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
  ];
}
const PATH = (() => {
  const P = [CTRL[0], ...CTRL, CTRL[CTRL.length - 1]];
  const pts = [];
  for (let i = 0; i < P.length - 3; i++)
    for (let s = 0; s < 24; s++) pts.push(catmull(P[i], P[i + 1], P[i + 2], P[i + 3], s / 24));
  pts.push(CTRL[CTRL.length - 1].slice());
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
})();

function pathAt(t) {
  const d = Math.max(0, Math.min(1, t)) * PATH.len;
  let lo = 0, hi = PATH.cum.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; (PATH.cum[m] <= d ? lo = m : hi = m); }
  const seg = PATH.cum[hi] - PATH.cum[lo] || 1;
  const f = (d - PATH.cum[lo]) / seg;
  const a = PATH.pts[lo], b = PATH.pts[hi];
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, dx: b[0] - a[0], dy: b[1] - a[1] };
}

const STOPS = CONFIG.stops.map((s, i) => {
  const t = (i + 1) / CONFIG.stops.length;
  const p = pathAt(t);
  return Object.assign({}, s, { t, x: p.x, y: p.y, index: i });
});

/* -------------------------------------------------------------- scenery -- */
let _seed = 20251006;
function rnd() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }

const HORIZON = 72;
function nearRoad(x, y, d) {
  for (let i = 0; i < PATH.pts.length; i += 2) {
    const p = PATH.pts[i];
    if (Math.abs(p[0] - x) < d && Math.abs(p[1] - y) < d) return true;
  }
  return false;
}
const TREES = (() => {
  const out = [];
  for (let i = 0; i < 260 && out.length < 26; i++) {
    const x = 8 + rnd() * 368, y = HORIZON + 6 + rnd() * 136;
    if (nearRoad(x, y, 17)) continue;
    if (x > 288 && y < 112) continue;            // keep castle hill clear
    if (out.some(o => Math.abs(o.x - x) < 20 && Math.abs(o.y - y) < 14)) continue;
    out.push({ x: Math.round(x), y: Math.round(y), big: rnd() > 0.55 });
  }
  return out.sort((a, b) => a.y - b.y);
})();
const CLOUDS = [
  { x: 40, y: 20, s: 2, v: 2.2 }, { x: 180, y: 34, s: 1, v: 1.4 },
  { x: 270, y: 14, s: 2, v: 3.0 }, { x: 330, y: 40, s: 1, v: 1.8 }
];
const ROADW = y => 3 + Math.round(3 * Math.max(0, Math.min(1, (y - 88) / 112)));

/* ----------------------------------------------------------------- state -- */
const S = { TITLE: 0, MAP: 1, WALK: 2, CARD: 3, END: 4 };
let state, idx, heroT, walk, card, parts, timeNow = 0, flash = 0;

function reset() {
  state = S.TITLE; idx = 0; heroT = 0;
  walk = null; card = null; parts = []; flash = 0;
}
reset();

function earned() {
  const set = new Set();
  for (let i = 0; i < idx; i++) if (STOPS[i].gear) set.add(STOPS[i].gear);
  return set;
}

function startWalk(targetIdx, back) {
  const from = heroT;
  const to = targetIdx < 0 ? 0 : STOPS[targetIdx].t;
  const dist = Math.abs(to - from) * PATH.len;
  walk = { from, to, t: 0, dur: Math.max(0.45, dist / 52), back: !!back, target: targetIdx };
  state = S.WALK;
}
function openCard(i) {
  const st = STOPS[i];
  card = { i: i, anim: 0 };
  state = S.CARD;
  if (st.gear) burst(st.x, st.y - 6, "#f2b705", 14);
}
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, sp = 14 + rnd() * 34;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 22, life: 0.7 + rnd() * 0.5, col, g: 70 });
  }
}
function confetti() {
  const cols = ["#d2051e", "#ffffff", "#f2b705", "#2f6fd0"];
  for (let i = 0; i < 70; i++)
    parts.push({
      x: rnd() * W, y: -4 - rnd() * 60, vx: (rnd() - 0.5) * 20, vy: 24 + rnd() * 40,
      life: 3 + rnd() * 2, col: cols[(rnd() * cols.length) | 0], g: 6
    });
}

/* ----------------------------------------------------------------- input -- */
function advance() {
  if (state === S.TITLE) { state = S.MAP; return; }
  if (state === S.MAP) {
    if (idx < STOPS.length) startWalk(idx);
    else { state = S.END; confetti(); }
    return;
  }
  if (state === S.WALK) { walk.t = walk.dur; return; }
  if (state === S.CARD) {
    const done = card.i === STOPS.length - 1;
    card = null;
    if (done) { state = S.END; confetti(); flash = 0.5; } else state = S.MAP;
    return;
  }
}
function goBack() {
  if (state === S.CARD) { card = null; state = S.MAP; return; }
  if (state === S.END) { state = S.MAP; parts.length = 0; return; }
  if (state === S.WALK) { walk.t = walk.dur; return; }
  if (state === S.MAP && idx > 0) { idx--; startWalk(idx - 1, true); return; }
  if (state === S.MAP && idx === 0) state = S.TITLE;
}
function reopen() {
  if ((state === S.MAP || state === S.END) && idx > 0) openCard(idx - 1);
}

addEventListener("keydown", e => {
  const k = e.key;
  if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); advance(); }
  else if (k === "b" || k === "B" || k === "Backspace" || k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); goBack(); }
  else if (k === "Enter" || k === "ArrowUp") { e.preventDefault(); reopen(); }
  else if (k === "r" || k === "R") { reset(); }
  else if (k === "f" || k === "F") {
    const el = document.getElementById("wrap");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }
});
cv.addEventListener("mousedown", () => advance());

/* ------------------------------------------------------------ world draw -- */
function drawSky() {
  rect(0, 0, W, HORIZON, "#7fd1f2");
  rect(0, 0, W, 18, "#92dcf6");
  rect(0, HORIZON - 10, W, 10, "#b9e9fb");
  // sun
  rect(46, 16, 14, 14, "#fff3b0"); rect(44, 18, 18, 10, "#fff3b0");
  for (const c of CLOUDS) {
    const x = ((c.x + timeNow * c.v) % (W + 60)) - 30, s = c.s;
    rect(x, c.y, 18 * s, 4 * s, "#ffffff");
    rect(x + 4 * s, c.y - 3 * s, 10 * s, 4 * s, "#ffffff");
    rect(x + 2 * s, c.y + 4 * s, 14 * s, 2 * s, "#dff2fb");
  }
  // mountains
  for (const m of [[30, 54, 30], [70, 50, 40], [230, 52, 34], [268, 46, 44], [310, 54, 26]]) {
    for (let i = 0; i < m[2]; i++) {
      const hh = Math.round((1 - Math.abs(i - m[2] / 2) / (m[2] / 2)) * (HORIZON - m[1]));
      rect(m[0] + i, HORIZON - hh, 1, hh, i < m[2] / 2 ? "#8fa3c4" : "#76899f");
    }
  }
}
function drawGround() {
  rect(0, HORIZON, W, H - HORIZON, "#58a84a");
  for (let y = HORIZON; y < H; y += 4) {
    const shade = (y - HORIZON) / (H - HORIZON);
    rect(0, y, W, 2, shade > 0.5 ? "#4b9540" : "#52a046");
  }
  rect(0, HORIZON, W, 3, "#6cbd5a");
  // castle hill
  for (let i = 0; i < 110; i++) {
    const x = 276 + i;
    const hh = Math.round(26 * Math.sin(Math.max(0, Math.min(1, i / 110)) * Math.PI));
    if (hh > 0) { rect(x, 100 - hh, 1, hh + 14, "#63b254"); rect(x, 100 - hh, 1, 2, "#79c966"); }
  }
}
function drawRoad() {
  const p = PATH.pts;
  for (let i = 0; i < p.length; i++) {
    const w = ROADW(p[i][1]);
    rect(p[i][0] - w - 1, p[i][1] - w - 1, 2 * w + 3, 2 * w + 3, "#6b5a45");
  }
  for (let i = 0; i < p.length; i++) {
    const w = ROADW(p[i][1]);
    rect(p[i][0] - w, p[i][1] - w, 2 * w + 1, 2 * w + 1, "#c2a878");
  }
  for (let i = 0; i < p.length; i++) {
    const w = ROADW(p[i][1]);
    rect(p[i][0] - w + 1, p[i][1] - w + 1, 2 * w - 1, 2 * w - 1, "#d8c295");
  }
  // dashes
  let d = 6;
  while (d < PATH.len - 4) {
    const q = pathAt(d / PATH.len);
    rect(q.x - 1, q.y - 1, 2, 2, "#f0e2bd");
    d += 11;
  }
}
function drawTree(x, y, big) {
  const h = big ? 10 : 7, w = big ? 11 : 9;
  rect(x - 1, y - 3, 3, 4, "#6b4a2c");
  rect(x - (w >> 1), y - 3 - h, w, h, "#2f7a3b");
  rect(x - (w >> 1) + 1, y - 2 - h, w - 2, h - 1, "#3b9349");
  rect(x - (w >> 1) + 2, y - 2 - h, 3, 3, "#53ad5c");
  rect(x - (w >> 1), y - 2, w, 2, "rgba(20,40,20,0.18)");
}
function drawStartMarker() {
  const p = pathAt(0);
  const x = Math.round(p.x) - 7, y = Math.round(p.y);
  rect(x - 1, y - 18, 2, 18, "#7a5a3a");
  const waveN = Math.sin(timeNow * 4) > 0 ? 1 : 0;
  rect(x + 1, y - 18, 11, 7, "#f2b705");
  rect(x + 1, y - 18, 11, 1, "#ffd95e");
  rect(x + 11, y - 18 + waveN, 2, 7, "#f2b705");
  text(CONFIG.startLabel, x + 6, y + 6, 1, "#ffffff", "center", "#1b1426");
}

function drawCastle(cx, baseY) {
  const stone = "#b9bcc9", stoneD = "#8e93a5", stoneL = "#d4d7e2";
  const bob = Math.sin(timeNow * 3) > 0 ? 1 : 0;
  // towers
  for (const tx of [cx - 26, cx + 16]) {
    rect(tx, baseY - 44, 10, 44, stone);
    rect(tx, baseY - 44, 2, 44, stoneL);
    rect(tx + 8, baseY - 44, 2, 44, stoneD);
    for (let i = 0; i < 3; i++) rect(tx + i * 4, baseY - 48, 3, 4, stone);
    // roof
    for (let i = 0; i < 7; i++) rect(tx - 2 + i, baseY - 55 - (3 - Math.abs(i - 3)) * 2, 1, 7 + (3 - Math.abs(i - 3)) * 2, "#d2051e");
    rect(tx + 4, baseY - 66, 1, 5, "#8e8e8e");
    rect(tx + 5, baseY - 66, 4 + bob, 3, "#ffffff");
  }
  // keep
  rect(cx - 18, baseY - 34, 36, 34, stone);
  rect(cx - 18, baseY - 34, 36, 2, stoneL);
  rect(cx - 18, baseY - 4, 36, 4, stoneD);
  for (let i = 0; i < 5; i++) rect(cx - 18 + i * 8, baseY - 38, 5, 4, stone);
  // windows
  for (const wx of [cx - 11, cx + 7]) { rect(wx, baseY - 28, 4, 6, "#2b3550"); rect(wx, baseY - 28, 4, 2, "#1d2438"); }
  // banner
  rect(cx - 5, baseY - 30, 10, 14, "#d2051e");
  rect(cx - 5, baseY - 30, 10, 2, "#ff3348");
  rect(cx - 3, baseY - 26, 6, 2, "#ffffff");
  rect(cx - 3, baseY - 23, 2, 5, "#ffffff");
  rect(cx + 1, baseY - 23, 2, 5, "#ffffff");
  // gate
  rect(cx - 7, baseY - 14, 14, 14, "#3a2a1c");
  rect(cx - 6, baseY - 12, 12, 12, "#6b4a2c");
  rect(cx - 1, baseY - 12, 2, 12, "#3a2a1c");
  rect(cx - 6, baseY - 13, 12, 1, "#8a6238");
  // mortar speckle
  for (let i = 0; i < 18; i++) {
    const px = cx - 18 + ((i * 7) % 36), py = baseY - 33 + ((i * 11) % 30);
    rect(px, py, 1, 1, stoneD);
  }
}

function drawStopNode(st, status, pulse) {
  const x = Math.round(st.x), y = Math.round(st.y);
  if (st.isCastle) {                       // the castle is its own marker
    if (status === "locked") spr(SPR_LOCK, x - 3, y - 26, 2, false, "#8d93a1");
    if (status === "next") {
      const ay = y - 34 - Math.round(Math.abs(Math.sin(pulse * 5)) * 3);
      for (let i = 0; i < 5; i++) rect(x - 4 + i, ay + i, 9 - i * 2, 2, "#ffffff");
    }
    text(st.label, x, y + 8, 1, status === "locked" ? "#9aa3ae" : "#ffffff", "center", "#1b1426");
    return;
  }
  const body = status === "locked" ? "#8d93a1" : status === "done" ? "#2f9e4f" : "#d2051e";
  const lite = status === "locked" ? "#aab0bd" : status === "done" ? "#47c169" : "#ff3348";
  // post + shadow
  rect(x - 5, y + 5, 11, 2, "rgba(20,30,20,0.25)");
  rect(x - 1, y - 2, 2, 8, "#6b4a2c");
  const yy = y - 10 + (status === "next" ? Math.round(Math.sin(pulse * 5)) : 0);
  rect(x - 5, yy - 4, 10, 9, "#1b1426");
  rect(x - 4, yy - 5, 8, 11, "#1b1426");
  rect(x - 4, yy - 3, 8, 7, body);
  rect(x - 3, yy - 4, 6, 9, body);
  rect(x - 3, yy - 4, 6, 2, lite);
  if (status === "locked") spr(SPR_LOCK, x - 3, yy - 3, 1, false, null);
  if (status === "done") spr(SPR_CHECK, x - 3, yy - 2, 1);
  if (status === "next") {
    const r = 6 + Math.round(Math.abs(Math.sin(pulse * 3)) * 2);
    frame(x - r, yy - r + 1, r * 2, r * 2, 1, "rgba(255,255,255,0.45)");
    const ay = yy - 16 - Math.round(Math.abs(Math.sin(pulse * 5)) * 2);
    rect(x - 3, ay, 7, 1, "#ffffff"); rect(x - 2, ay + 1, 5, 1, "#ffffff");
    rect(x - 1, ay + 2, 3, 1, "#ffffff"); rect(x, ay + 3, 1, 1, "#ffffff");
  }
  // label
  const lab = st.label;
  const col = status === "locked" ? "#9aa3ae" : "#ffffff";
  text(lab, x, y + 8, 1, col, "center", "#1b1426");
}

function drawHero(x, y, right, moving, phase) {
  const g = earned();
  const bob = moving ? (Math.sin(phase * 11) > 0 ? 0 : 1) : (Math.sin(timeNow * 2.2) > 0 ? 0 : 1);
  const ox = Math.round(x) - 4, oy = Math.round(y) - 13 + bob;
  rect(ox + 1, oy + 13, 6, 2, "rgba(20,30,20,0.3)");
  if (g.has("shield")) spr(SPR_SHIELD, right ? ox - 4 : ox + 7, oy + 5, 1, !right);
  spr(HERO_TOP, ox, oy, 1, !right);
  const legs = moving ? (Math.sin(phase * 11) > 0 ? HERO_LEGS_A : HERO_LEGS_B) : HERO_LEGS_A;
  spr(legs, ox, oy + 10, 1, !right);
  if (g.has("hat")) spr(SPR_HAT, ox, oy - 2, 1, !right);
  if (g.has("club")) spr(SPR_CLUB, right ? ox + 6 : ox - 2, oy + 3, 1, !right);
}

function drawHud() {
  // progress pips
  const n = STOPS.length, pw = 8, total = n * pw;
  const bx = Math.round(W / 2 - total / 2), by = 7;
  rect(bx - 5, by - 4, total + 9, 13, "rgba(20,16,32,0.55)");
  for (let i = 0; i < n; i++) {
    const on = i < idx;
    rect(bx + i * pw, by, 6, 6, on ? "#d2051e" : "rgba(255,255,255,0.35)");
    if (on) rect(bx + i * pw, by, 6, 2, "#ff3348");
  }
  // gear tray
  const keys = ["club", "shield", "hat"], g = earned();
  const gx = 7, gy = H - 25;
  rect(gx - 3, gy - 4, 3 * 16 + 6, 26, "rgba(20,16,32,0.55)");
  keys.forEach((k, i) => {
    const x = gx + i * 16, has = g.has(k);
    rect(x, gy - 1, 13, 15, has ? "rgba(255,255,255,0.14)" : "rgba(0,0,0,0.18)");
    frame(x, gy - 1, 13, 15, 1, has ? "#ffffff" : "rgba(255,255,255,0.22)");
    spr(GEAR_ICON[k], x + (k === "shield" ? 4 : k === "hat" ? 2 : 4), gy + (k === "hat" ? 5 : 3), 1, false,
        has ? null : "rgba(255,255,255,0.18)");
  });
  text("GEAR", gx, H - 7, 1, "rgba(255,255,255,0.55)", "left", "#1b1426");
}

function promptTag(label, x, y, s) {
  if (Math.sin(timeNow * 4) < -0.35) return;
  const ax = Math.round(x) - 3, ay = Math.round(y) + 1;
  rect(ax, ay, 1, 5, "#ffffff"); rect(ax + 1, ay + 1, 1, 3, "#ffffff"); rect(ax + 2, ay + 2, 1, 1, "#ffffff");
  text(label, ax - 4, y, s, "#ffffff", "right", "#1b1426");
}

/* ------------------------------------------------------------------ card -- */
function drawCard() {
  const st = STOPS[card.i];
  const a = Math.min(1, card.anim / 0.14);
  ctx.fillStyle = "rgba(10,8,18," + (0.74 * a).toFixed(3) + ")";
  ctx.fillRect(0, 0, W, H);

  const fw = 316, fh = 156;
  const w = Math.round(fw * (0.86 + 0.14 * a)), h = Math.round(fh * (0.86 + 0.14 * a));
  const x = Math.round(W / 2 - w / 2), y = Math.round(H / 2 - h / 2);
  if (a < 1) { frame(x, y, w, h, 2, "#ffffff"); return; }

  rect(x + 3, y + 4, w, h, "rgba(0,0,0,0.45)");
  rect(x, y, w, h, "#17142a");
  frame(x, y, w, h, 2, "#ffffff");
  rect(x + 2, y + 2, w - 4, 22, "#d2051e");
  rect(x + 2, y + 2, w - 4, 2, "#ff3348");
  rect(x + 2, y + 22, w - 4, 2, "#8e0313");

  text(st.title, x + 10, y + 7, 2, "#ffffff", "left", "#8e0313");
  text((card.i + 1) + "/" + STOPS.length, x + w - 10, y + 10, 1, "#ffd3d7", "right");

  let ty = y + 36;
  for (const raw of st.lines) {
    for (const line of wrap(raw, 23)) {
      rect(x + 12, ty + 4, 4, 4, "#f2b705");
      text(line, x + 20, ty, 2, "#f3f1ff", "left", "#000000");
      ty += 20;
    }
    ty += 2;
  }

  if (st.gear) {
    const by = y + h - 32;
    rect(x + 10, by, w - 20, 20, "rgba(242,183,5,0.14)");
    frame(x + 10, by, w - 20, 20, 1, "#f2b705");
    spr(GEAR_ICON[st.gear], x + 16, by + (st.gear === "hat" ? 8 : 6), 1);
    text(st.gearText || (CONFIG.gearNames[st.gear] + " ACQUIRED"), x + 30, by + 7, 1, "#ffd95e", "left");
  }
  promptTag("SPACE", x + w - 10, y + h - 11, 1);
}

/* ----------------------------------------------------------------- scenes -- */
function drawTitle() {
  drawSky(); drawGround(); drawRoad();
  for (const t of TREES) drawTree(t.x, t.y, t.big);
  drawCastle(300, 150);
  drawHero(70, 180, true, false, 0);
  ctx.fillStyle = "rgba(10,8,18,0.55)"; ctx.fillRect(0, 0, W, H);

  text(CONFIG.title, W / 2, 46, 4, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 80, 82, 160, 2, "#d2051e");
  text(CONFIG.subtitle, W / 2, 92, 1, "#ffd3d7", "center", "#1b1426");
  if (CONFIG.byline) text(CONFIG.byline, W / 2, 108, 1, "rgba(255,255,255,0.6)", "center", "#1b1426");

  // gear showcase
  const keys = ["club", "shield", "hat"];
  keys.forEach((k, i) => {
    const x = W / 2 - 36 + i * 28, y = 132;
    rect(x - 2, y - 2, 20, 22, "rgba(255,255,255,0.10)");
    frame(x - 2, y - 2, 20, 22, 1, "rgba(255,255,255,0.35)");
    spr(GEAR_ICON[k], x + (k === "shield" ? 6 : k === "hat" ? 4 : 6), y + (k === "hat" ? 7 : 5), 1);
  });

  if (Math.sin(timeNow * 4) > -0.35)
    text(CONFIG.pressStart, W / 2, 180, 2, "#ffffff", "center", "#1b1426");
}

function drawMapScene() {
  drawSky(); drawGround(); drawRoad();
  drawStartMarker();

  const items = [];
  for (const t of TREES) items.push({ y: t.y, f: () => drawTree(t.x, t.y, t.big) });
  items.push({ y: 86, f: () => drawCastle(332, 90) });
  STOPS.forEach((st, i) => {
    const status = i < idx ? "done" : i === idx ? (state === S.WALK && !walk.back ? "locked" : "next") : "locked";
    items.push({ y: st.y + (st.isCastle ? 0.7 : 0.5), f: () => drawStopNode(st, status, timeNow) });
  });
  const hp = pathAt(heroT);
  const moving = state === S.WALK;
  const dir = moving ? (walk.to >= walk.from ? 1 : -1) : 1;
  const right = moving ? (hp.dx * dir >= 0) : true;
  items.push({ y: hp.y + 0.6, f: () => drawHero(hp.x, hp.y, right, moving, timeNow) });
  items.sort((a, b) => a.y - b.y).forEach(o => o.f());

  drawParticles();
  drawHud();

  if (state === S.MAP) {
    const label = idx >= STOPS.length ? "FINISH" : "SPACE";
    promptTag(label, W - 8, H - 14, 1);
    if (idx < STOPS.length)
      text("NEXT: " + STOPS[idx].label, W - 10, H - 26, 1, "rgba(255,255,255,0.75)", "right", "#1b1426");
  }
}

function drawEnd() {
  drawMapScene();
  ctx.fillStyle = "rgba(10,8,18,0.62)"; ctx.fillRect(0, 0, W, H);
  text(CONFIG.endTitle, W / 2, 56, 3, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 70, 86, 140, 2, "#d2051e");
  let y = 98;
  for (const raw of CONFIG.endLines)
    for (const l of wrap(raw, 26)) { text(l, W / 2, y, 2, "#f3f1ff", "center", "#000000"); y += 20; }
  const keys = ["club", "shield", "hat"];
  keys.forEach((k, i) => {
    const x = W / 2 - 36 + i * 28, yy = 142;
    rect(x - 2, yy - 2, 20, 22, "rgba(255,255,255,0.12)");
    frame(x - 2, yy - 2, 20, 22, 1, "#f2b705");
    spr(GEAR_ICON[k], x + (k === "shield" ? 6 : k === "hat" ? 4 : 6), yy + (k === "hat" ? 7 : 5), 1);
  });
  if (Math.sin(timeNow * 3) > -0.4)
    text(CONFIG.endPrompt, W / 2, 180, 2, "#ffd95e", "center", "#1b1426");
}

function drawParticles() {
  for (const p of parts) rect(p.x, p.y, 2, 2, p.col);
}

/* ------------------------------------------------------------------ loop -- */
let last = performance.now();
function tick(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  timeNow += dt;

  if (state === S.WALK) {
    walk.t += dt;
    const k = Math.min(1, walk.t / walk.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    heroT = walk.from + (walk.to - walk.from) * e;
    if (k >= 1) {
      heroT = walk.to;
      if (walk.back) { state = S.MAP; walk = null; }
      else {
        const i = walk.target; walk = null;
        idx = i + 1; flash = 0.22;
        burst(STOPS[i].x, STOPS[i].y - 10, "#cdd3de", 10);
        openCard(i);
      }
    }
  }
  if (card) card.anim += dt;
  if (flash > 0) flash -= dt;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    if (p.life <= 0 || p.y > H + 6) parts.splice(i, 1);
  }

  if (state === S.TITLE) drawTitle();
  else if (state === S.END) drawEnd();
  else { drawMapScene(); if (state === S.CARD) drawCard(); }

  if (flash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.5, flash * 1.6).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
