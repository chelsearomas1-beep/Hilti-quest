// Game logic and layout use a 384x216 grid; the canvas is 768x432 (SS = 2 device pixels per grid unit),
// so detailed art (hero, teammates, buildings) is drawn on a half-unit grid via hi() / drawHeroHi().
const W = 384, H = 216, SS = 2, CW = W * SS, CH = H * SS;
const cv  = document.getElementById("c");
cv.width = CW; cv.height = CH;
let ctx = cv.getContext("2d", { alpha: false });
const mainCtx = ctx;
const sil = document.createElement("canvas"); sil.width = CW; sil.height = CH;
const silCtx = sil.getContext("2d");
for (const c of [mainCtx, silCtx]) { c.setTransform(SS, 0, 0, SS, 0, 0); c.imageSmoothingEnabled = false; }

function fit() {                      // whole device pixels per canvas pixel keeps the image crisp
  const dpr = window.devicePixelRatio || 1;
  let s = Math.min(window.innerWidth * dpr / CW, window.innerHeight * dpr / CH);
  if (s >= 1) s = Math.floor(s);
  cv.style.width  = (CW * s / dpr) + "px";
  cv.style.height = (CH * s / dpr) + "px";
}
window.addEventListener("resize", fit);
fit();

function rect(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function hi(x, y, fn) {            // run fn in a local half-unit pixel grid whose origin is (x, y)
  ctx.save(); ctx.translate(x, y); ctx.scale(0.5, 0.5); fn(); ctx.restore();
}
function frame(x, y, w, h, t, col) { // hollow rect, thickness t
  rect(x, y, w, t, col); rect(x, y + h - t, w, t, col);
  rect(x, y, t, h, col); rect(x + w - t, y, t, h, col);
}

function ell(cx, cy, rx, ry, col) { // filled ellipse
  for (let dy = -ry; dy <= ry; dy++) {
    const half = Math.round(rx * Math.sqrt(1 - (dy / ry) * (dy / ry)));
    rect(cx - half, cy + dy, half * 2 + 1, 1, col);
  }
}

function textW(str, s) { return str.length ? str.length * 6 * s - s : 0; }

function text(str, x, y, s, col, align, shadow) {
  str = String(str).toUpperCase();
  const w = textW(str, s);
  const X = align === "center" ? Math.round(x - w / 2) : align === "right" ? Math.round(x - w) : Math.round(x);
  const Y = Math.round(y);
  if (shadow) drawRun(str, X + s, Y + s, s, shadow);
  drawRun(str, X, Y, s, col);
}
function drawRun(str, X, Y, s, col) {
  ctx.fillStyle = col;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]];
    if (g) {
      for (let r = 0; r < 7; r++) {
        const row = g[r];
        for (let c = 0; c < 5; c++) if (row[c] === "#") ctx.fillRect(X + c * s, Y + r * s, s, s);
      }
    }
    X += 6 * s;
  }
}
function wrap(str, maxChars) {
  const words = String(str).toUpperCase().split(/\s+/);
  const out = []; let line = "";
  for (const w of words) {
    if (!line) line = w;
    else if ((line + " " + w).length <= maxChars) line += " " + w;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}

const CTRL = [
  [14, 202], [54, 190], [100, 202], [146, 186], [182, 162], [166, 138],
  [122, 126], [130, 104], [180, 96], [238, 104], [286, 118], [316, 104], [332, 88]
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
  ];
}
const PATH = (() => {
  const P = [CTRL[0], ...CTRL, CTRL[CTRL.length - 1]];
  const pts = [];
  for (let i = 0; i < P.length - 3; i++)
    for (let s = 0; s < 24; s++) pts.push(catmull(P[i], P[i + 1], P[i + 2], P[i + 3], s / 24));
  pts.push(CTRL[CTRL.length - 1].slice());
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
})();

function pathAt(t) {
  const d = Math.max(0, Math.min(1, t)) * PATH.len;
  let lo = 0, hi = PATH.cum.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; (PATH.cum[m] <= d ? lo = m : hi = m); }
  const seg = PATH.cum[hi] - PATH.cum[lo] || 1;
  const f = (d - PATH.cum[lo]) / seg;
  const a = PATH.pts[lo], b = PATH.pts[hi];
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, dx: b[0] - a[0], dy: b[1] - a[1] };
}

const STOPS = CONFIG.stops.map((s, i) => {
  const t = (i + 1) / CONFIG.stops.length;
  const p = pathAt(t);
  return Object.assign({}, s, {   // normalise the short config fields into what the engine reads
    label: s.title, toolSteps: [].concat(s.tools || []).map(r => (typeof r === "string" ? { tool: r } : r)),
    tools: [].concat(s.tools || []).map(r => (typeof r === "string" ? r : r.tool)), lines: s.line.split("\n"),
    battle: s.boss ? { boss: s.boss, sprite: s.sprite, weapon: s.weapon, power: s.power, hits: s.hits || 3 } : null,
    t, x: p.x, y: p.y, index: i
  });
});

function nearRoad(x, y, d) {
  for (let i = 0; i < PATH.pts.length; i += 2) {
    const p = PATH.pts[i];
    if (Math.abs(p[0] - x) < d && Math.abs(p[1] - y) < d) return true;
  }
  return false;
}
function blocked(x, y) {
  if (x > 288 && y < 112) return true;                       // castle hill
  if (Math.abs(x - POND.x) < POND.rx + 6 && Math.abs(y - POND.y) < POND.ry + 12) return true;
  return STOPS.some(s => s.art && x > s.lx - LAND[s.art].l - 8 && x < s.lx + LAND[s.art].r + 8 &&
                         y > s.ly - LAND[s.art].h - 4 && y < s.ly + 10);
}

  const out = [];
  for (let i = 0; i < 400 && out.length < 28; i++) {
    const x = 8 + rnd() * 368, y = HORIZON + 6 + rnd() * 136;
    if (nearRoad(x, y, 17) || blocked(x, y)) continue;
    if (out.some(o => Math.abs(o.x - x) < 20 && Math.abs(o.y - y) < 14)) continue;
    out.push({ x: Math.round(x), y: Math.round(y), big: rnd() > 0.55, pine: rnd() > 0.5 });
  }
  return out.sort((a, b) => a.y - b.y);
})();

function finishAttack() { card.atk = -1; if (card.hits >= hitsNeeded()) card.fade = 0; }   // the last blow defeats the boss

  if (STOPS[card.i].script) return;                           // the germ just goes away; no fanfare
  flash = 0.35;
  burst(W / 2 + 80, H / 2 - 10, "#f2b705", 26); burst(W / 2 + 80, H / 2 - 10, "#ffffff", 16);
}
function burst(x, y, col, n) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, sp = 14 + rnd() * 34;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 22, life: 0.7 + rnd() * 0.5, col, g: 70 });

  for (let i = 0; i < 70; i++)
    parts.push({
      x: rnd() * W, y: -4 - rnd() * 60, vx: (rnd() - 0.5) * 20, vy: 24 + rnd() * 40,
      life: 3 + rnd() * 2, col: cols[(rnd() * cols.length) | 0], g: 6

function closeCard() {
  const done = card.i === STOPS.length - 1;
  card = null;
  if (done) { state = S.END; confetti(); flash = 0.5; } else state = S.MAP;
}
function battleStep() {                       // one press while a boss is alive: swing (or skip the swing / the fade)
  if (card.fade >= 0) { winBattle(); return; }
  if (card.atk >= 0) finishAttack();
  if (card.hits < hitsNeeded() && card.fade < 0) startAttack();
}
function advance() {                          // SPACE (or a click): next / attack
  if (state === S.TITLE) { state = S.MAP; timerOn = true; return; }
  if (state === S.MAP) {
    const pi = idx - 1;
    if (pi >= 0 && STOPS[pi].battle && !won[pi]) openCard(pi);     // unfinished boss fight blocks the road
    else if (idx < STOPS.length) startWalk(idx);
    else { state = S.END; confetti(); }
    return;
  }
  if (state === S.WALK) { walk.t = walk.dur; return; }
  if (state === S.CARD) {
    const st = STOPS[card.i];
    if (st.finale) {                                                 // castle finale: Space steps through towers -> globe -> steps -> hat + toolkit
      const g = card.g;
      if (card.stage === 1) {                                        // the globe: Enter zooms in/out; Space visits the next city, then moves on once back at the castle
        if (g.mode === 1 && g.z >= 1 && !g.zd) { if (g.rot) globeFinishRot(); else if (g.placed < st.finale.cities.length) startRot(st.finale); }
        else if (g.mode === 2) { card.stage++; card.st = 0; }
      }
      else if (card.stage < 3) { card.stage++; card.st = 0; }
      else if (card.st >= finaleTimes().done) closeCard();
      else card.st = finaleTimes().done;                            // skip the rest of the hat / toolkit animation
      return;
    }
    if (st.script) { if (card.phase === 2 && card.stage === 1) closeCard(); return; }   // scripted card: Enter acts, Space only continues once the answer is shown
    if (st.battle && card.phase < 2) { battleStep(); return; }       // each Space is one attack; pressing mid-swing finishes it and swings again
    closeCard();

}
function finaleTimes() {                      // seconds into the last finale screen
  if (reduceMotion) return { land: 0, lights: 0, gap: 0, quote: 0, done: 0 };
  const land = 1.1, lights = land + 0.4, gap = 0.28;
  return { land, lights, gap, quote: land, done: lights + 7 * gap + 0.2 };
}
function goBack() {
  if (state === S.CARD) { card = null; state = S.MAP; return; }

  if (state === S.WALK) { walk.t = walk.dur; return; }

  if (nx && isMystery(nx)) { revealed[card.i + 1] = true; flash = 0.3; burst(bossPt().x, bossPt().y + 4, "#ffffff", 22); burst(bossPt().x, bossPt().y + 4, "#c8102e", 14); }
}
function enterKey() {                         // ENTER on a card: reveal / use. Only the scripted High School card and the Hilti globe respond.
  const st = STOPS[card.i];

    const g = card.g, n = st.finale.cities.length;

  if (state === S.MAP && idx < STOPS.length && isMystery(STOPS[idx])) { revealStop(idx); return; }

addEventListener("keydown", e => {
  const k = e.key;
  if (k === " " || k === "Spacebar" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); advance(); }
  else if (k === "b" || k === "B" || k === "Backspace" || k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); goBack(); }
  else if (k === "Enter" || k === "ArrowUp") { e.preventDefault(); if (state === S.CARD) enterKey(); else reopen(); }
  else if (k === "r" || k === "R") { reset(); }
  else if (k === "f" || k === "F") {
    const el = document.getElementById("wrap");
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }
});

// All buildings below are drawn inside hi(): a half-unit pixel grid, origin = centre of the base.
function bricks(x, y, w, h, base, mortar, light) {
  rect(x, y, w, h, base);
  for (let r = 0; r * 4 < h; r++) {
    rect(x, y + r * 4 + 3, w, 1, mortar);
    for (let jx = x + (r % 2) * 4; jx < x + w; jx += 8) rect(jx, y + r * 4, 1, 3, mortar);
  }
  for (let i = 0; i < (w * h) / 60; i++) rect(x + ((i * 37) % Math.max(1, w - 4)), y + ((i * 17) % Math.max(1, h - 3)), 3, 2, light);
}
function cone(cx, yBase, wBase, hh, a, b) {      // pointed roof, narrowing to the top
  for (let r = 0; r < hh; r++) {
    const w = Math.max(2, Math.round(wBase * (1 - r / hh)));
    rect(cx - (w >> 1), yBase - r, w, 1, r % 3 === 2 ? b : a);
    rect(cx - (w >> 1), yBase - r, Math.max(1, w >> 2), 1, "rgba(255,255,255,0.14)");
  }
}

function lancet(cx, yb, w, h, col) {   // pointed (gothic) arch shape: straight sides below, pointed top; base at yb
  const rise = Math.min(h, Math.round(w * 0.95));
  rect(cx - (w >> 1), yb - h + rise, w, h - rise, col);
  for (let r = 0; r < rise; r++) {
    const half = Math.max(0, Math.round((w / 2) * (1 - Math.pow((r + 0.5) / rise, 1.4))));
    rect(cx - half, yb - h + rise - 1 - r, half * 2 + (w % 2), 1, col);
  }
}

function shapes(list, bw, flip) {      // [x, y, w, h, colour] boxes, mirrored about the box width when flip
  for (const s of list) rect(flip ? bw - s[0] - s[2] : s[0], s[1], s[2], s[3], PAL[s[4]] || s[4]);
}
function pix(rows, x, y, bw, flip) {   // pixel-art rows of PAL letters, drawn as merged runs
  const w = rows[0].length;
  rows.forEach((row, r) => {
    for (let c = 0; c < w;) {
      let n = 1;
      while (c + n < w && row[c + n] === row[c]) n++;
      if (PAL[row[c]]) rect(flip ? bw - (x + c + n) : x + c, y + r, n, 1, PAL[row[c]]);
      c += n;
    }
  });
}

/* ---- stop logos: a JPEG is pixelated by drawing it onto a tiny offscreen canvas, its near-white background is made transparent,
   then it is scaled up with smoothing OFF ---- */
const LOGO_IMG = {}, LOGO_PX = {};
function logoCanvas(src, wPx) {          // the logo (white removed, cropped to its shape) as a small offscreen canvas; null until loaded
  if (!LOGO_IMG[src]) { const im = new Image(); im.src = IMAGES[src] || src; LOGO_IMG[src] = im; }
  const im = LOGO_IMG[src], key = src + "@" + wPx;
  if (!im.complete || !im.naturalWidth) return null;
  if (!LOGO_PX[key]) {
    const c = document.createElement("canvas"); c.width = wPx; c.height = Math.max(1, Math.round(wPx * im.naturalHeight / im.naturalWidth));
    const cx = c.getContext("2d", { willReadFrequently: true }); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";   // averages down to the small pixel grid
    cx.drawImage(im, 0, 0, c.width, c.height);
    let out = c;
    try {
      const d = cx.getImageData(0, 0, c.width, c.height), px = d.data;
      const w = c.width, h = c.height, bg = new Uint8Array(w * h), stack = [];
      const light = q => px[q * 4] > 225 && px[q * 4 + 1] > 225 && px[q * 4 + 2] > 225;        // near-white (a little slack for JPEG noise)
      const seed = q => { if (!bg[q] && light(q)) { bg[q] = 1; stack.push(q); } };
      for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }
      for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1); }
      while (stack.length) {                                                                 // near-white reachable from the edge = background; white inside the logo stays
        const q = stack.pop(), x = q % w, y = (q / w) | 0;
        if (x > 0) seed(q - 1); if (x < w - 1) seed(q + 1); if (y > 0) seed(q - w); if (y < h - 1) seed(q + w);
      }
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let q = 0; q < w * h; q++) {
        if (bg[q]) { px[q * 4 + 3] = 0; continue; }                                         // background -> transparent
        px[q * 4 + 3] = 255;                                                                // everything else fully opaque (crisp pixels)
        const x = q % w, y = (q / w) | 0;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      cx.putImageData(d, 0, 0);
      if (x1 >= 0) { out = document.createElement("canvas"); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1; out.getContext("2d").drawImage(c, -x0, -y0); }
      out.keyed = true;
    } catch (e) { out.keyed = false; }                                                        // pixels unreadable (image blocked): keep the white background
    LOGO_PX[key] = out;
  }
  return LOGO_PX[key];
}

    }
    else if (c.stage === 1) {
      if (c.g.mode === 0) put(F.zoomIn, 6, "#b01428");                                 // Enter is the only key that works here
      else if (c.g.mode === 2) F.globe.split("\n").forEach((l, j) => put(l, 6 + j * 13));          // shown once back at the castle
    }
    else {
      if (c.stage === 2) {                                   // three steps, numbered like the ones in the scene (smaller text so all fit)
        let yy = 6;
        F.steps.forEach((l, j) => {
          rect(x + 10, ty + yy - 1, 9, 9, ink); text(String(j + 1), x + 14.5, ty + yy + 1, 1, "#ffffff", "center");
          wrap(l, 50).forEach((r, k) => { text(r, x + 24, ty + yy, 1, ink, "left"); yy += 9; });
          yy += 3;
        });
      } else {
        if (c.st >= FT.quote) put(F.quote, 8);
        if (c.st >= FT.done) put(F.done, 28, "#1d6f42");
      }
    }
  } else {
    let rows = st.lines.flatMap(l => /^\s*- /.test(l) ? [l] : wrap(l, 35)), accent = -1;      // each configured line gets its own row ("- " = bullet, "  - " = indented sub-bullet)
    if (st.script) {                                         // the scripted card shows its prompt in the last row
      const nxs = STOPS[card.i + 1];
      if (c.phase === 0) { rows = rows.concat(CONFIG.ui.sanitize); accent = rows.length - 1; }
      else if (c.stage === 0) { rows = [CONFIG.ui.ask, CONFIG.ui.reveal]; accent = 1; }
      else rows = [(nxs && nxs.mystery ? nxs.mystery.label : "NEXT") + "."];
    }
    const list = rows.length > 4;                                                          // a five-row list is packed a little closer
    rows.slice(0, 5).forEach((l, j) => {
      const b = /^\s*- (.*)$/.exec(l), by = ty + (list ? 3 : 6) + j * (list ? 11 : 13);
      if (!b) { text(l, x + 10, by, 1.5, j === accent ? "#b01428" : ink, "left"); return; }
      rect(x + 10, by + 2, 5, 5, ink);                                                      // every bullet is the same size and indent
      text(b[1], x + 21, by, 1.5, ink, "left");
    });
  }
  dotsRow(x + w / 2, ty + th - 6, card.i, STOPS.length);
  if (!(st.finale && c.stage === 1 && c.g.mode === 1)) {     // "press space" tab on the text box edge (the zoomed globe has its own prompts)
    const lab = st.script && (ph < 2 || c.stage === 0) || st.finale && c.stage === 1 && c.g.mode === 0 ? CONFIG.ui.promptEnter : CONFIG.ui.promptSpace, tw = Math.round(textW(lab, 1.5)) + 18;
    const tx = x + w - tw - 6;
    rect(tx, ty - 14, tw, 15, "#1b1426"); frame(tx, ty - 14, tw, 15, 1, "#f4f1e6");
    text(lab, tx + 5, ty - 10, 1.5, "#ffffff", "left");
    if (Math.sin(timeNow * 4) > -0.35) { rect(tx + tw - 9, ty - 11, 2, 7, "#ffd95e"); rect(tx + tw - 7, ty - 10, 2, 5, "#ffd95e"); rect(tx + tw - 5, ty - 9, 2, 3, "#ffd95e"); }
  }
  if (bt && c.phase === 2) {                                 // tools in flight: pop out of the boss -> tray, then tray -> toolkit bar
    const sch = dropSchedule(st), T = toolTimes(), n = sch.length, bx = sx + sw - 84, by = gy - 44;
    sch.forEach((r, i) => {
      const sp = traySlot(i, n, tbx, tbw, ty), u = c.t - r.at, k = TOOL_KEYS.indexOf(r.tool);
      const ic = TOOL_ICON[r.tool], put = (cx, cy, sc) => { if (sc > 1) backTile(cx, cy); spr(ic, Math.round(cx - ic[0].length * sc / 2), Math.round(cy - ic.length * sc / 2), sc); };
      if (u >= 0 && u < T.pop) {                              // pops up out of the boss, arcs, then floats down into its slot
        const p = u / T.pop, e = p * p * (3 - 2 * p);
        const px = bx + (sp.cx - bx) * e + (reduceMotion ? 0 : Math.sin(p * Math.PI * 3) * 7 * (1 - p));
        const py = by + (sp.cy - by) * (0.4 * p + 0.6 * e) - (reduceMotion ? 0 : Math.sin(p * Math.PI) * 42);
        put(px, py, 2);
      } else if (u >= T.pop + T.hold && u < toolDone()) {     // the same tool flies up into the toolkit bar
        const p = (u - T.pop - T.hold) / T.fly, e = p * p * (3 - 2 * p);
        const tx2 = HUD_BAR.gx + k * HUD_BAR.pitch + HUD_BAR.sw / 2, ty2 = HUD_BAR.gy + HUD_BAR.sh / 2;
        put(sp.cx + (tx2 - sp.cx) * e, sp.cy + (ty2 - sp.cy) * e - (reduceMotion ? 0 : Math.sin(p * Math.PI) * 14), p > 0.6 ? 1 : 2);
      }
    });
  }
  if (st.finale && c.stage === 1) drawGlobeZoom(st.finale);   // the zoomed-in globe covers the whole screen
}

// Each tool is added in three beats: it pops out of the defeated boss and floats down into the toolkit tray in the text box
// (pop), rests there with its name under it (hold), then flies up into the toolkit bar (fly).
function toolTimes() { return reduceMotion ? { gap: 0.35, pop: 0.05, hold: 0.3, fly: 0.05 } : { gap: 0.6, pop: 1.0, hold: 0.5, fly: 0.6 }; }
function toolDone() { const T = toolTimes(); return T.pop + T.hold + T.fly; }     // seconds until a tool counts as in the toolkit bar
function dropSchedule(st) {                  // when each tool pops out of the boss (seconds after the win)
  let at = 0;
  return st.toolSteps.map((r, i) => {
    if (i) at += toolTimes().gap + (r.note ? 0.9 : 0);     // a noted tool waits for its card line
    return { tool: r.tool, note: r.note, at };
  });
}

function drawParty(ox, feetY, hop, drops, lunge, beside) {  // big battle-scene party: hero (4x the map size) in front, teammates behind her
  const g = earned(), s = 4, q = s / 2;            // q = grid units per hi-px
  const falling = k => !!(drops && drops.some(d => d.tool === k && d.p < 1));
  const skip = {}; for (const k of TOOL_KEYS) skip[k] = falling(k);
  const up = (k) => (hop && !reduceMotion ? Math.round(Math.abs(Math.sin(timeNow * 11 + k * 1.6)) * 5) : 0);
  const ms = mates();
  for (let k = ms.length - 1; k >= 0; k--)         // back row first so the hero stands in front of them
    drawMateHi(ox + (beside ? 76 : 68) + k * 38, feetY - (beside ? 0 : 5 + k * 5) - 32 * q - up(k + 1), s, true, false, 0, ms[k], k);
  const oy = feetY - 40 * q - up(0);
  drawHeroHi(ox + (lunge || 0), oy, s, true, false, 0, g, skip);
  (drops || []).forEach(d => {                       // tools fall onto the hero, one after another
    if (d.p <= 0 || d.p >= 1) return;
    const sp = HERO_SPOT[d.tool] || [12, 18];
    spr(TOOL_ICON[d.tool], Math.round(ox + sp[0] * q - 7), Math.round(oy + sp[1] * q - (1 - d.p * d.p) * 90), 3);
  });
}


/* ----------------------------------------------------------------- scenes -- */
function drawTitle() {
  drawSky(); drawGround(); drawRoad();
  for (const t of TREES) drawTree(t.x, t.y, t.big, t.pine);
  for (const o of PROPS) drawProp(o);
  drawCastle(300, 150);
  drawHero(70, 180, true, false, 0);
  ctx.fillStyle = "rgba(10,8,18,0.55)"; ctx.fillRect(0, 0, W, H);
  drawHintBar();

  text(CONFIG.title, W / 2, 46, 4, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 80, 82, 160, 2, "#d2051e");
  text(CONFIG.subtitle, W / 2, 92, 1, "#ffd3d7", "center", "#1b1426");
  if (CONFIG.byline) text(CONFIG.byline, W / 2, 108, 1, "rgba(255,255,255,0.6)", "center", "#1b1426");

  // toolkit showcase
  text(CONFIG.ui.toolkitBar, W / 2, 120, 1, "#ffd95e", "center", "#1b1426");
  TOOL_KEYS.forEach((k, i) => {
    const x = W / 2 - 92 + i * 28, y = 132;
    rect(x - 2, y - 2, 20, 22, "rgba(255,255,255,0.10)");
    frame(x - 2, y - 2, 20, 22, 1, "rgba(255,255,255,0.35)");
    iconAt(k, x - 2, y - 2, 20, 22);
  });

  if (Math.sin(timeNow * 4) > -0.35)
    lightLabel(CONFIG.pressStart, W / 2, 172, 2, "center");
}

function drawMapScene() {
  drawSky(); drawGround(); drawRoad();
  drawStartMarker();

  const items = [];
  ensureSigns();
  for (const t of TREES) if (!underSign(t.x - 7, t.y - 17, 14, 19)) items.push({ y: t.y, f: () => drawTree(t.x, t.y, t.big, t.pine) });
  for (const o of PROPS) if (!underSign(o.x - 6, o.y - 7, 12, 9)) items.push({ y: o.y, f: () => drawProp(o) });
  items.push({ y: 86, f: () => drawCastle(332, 90) });
  STOPS.forEach((st, i) => {
    const status = i < idx ? "done" : i === idx ? (state === S.WALK && !walk.back ? "locked" : "next") : "locked";
    items.push({ y: st.y + (st.isCastle ? 0.7 : 0.5), f: () => drawStopNode(st, status, timeNow) });
    if (st.art) items.push({ y: st.ly + 0.5, f: () => drawLandmark(st, status, timeNow) });
  });
  const hp = pathAt(heroT);
  const moving = state === S.WALK;
  const dir = moving ? (walk.to >= walk.from ? 1 : -1) : 1;
  const right = moving ? (hp.dx * dir >= 0) : true;
  items.push({ y: hp.y + 0.6, f: () => drawHero(hp.x, hp.y, right, moving, timeNow) });
  mates().forEach((style, k) => {
    const t = Math.max(0, Math.min(1, heroT - heroDir * (14 * (k + 1)) / PATH.len)), mp = pathAt(t);
    items.push({ y: mp.y + 0.5, f: () => drawMate(mp.x, mp.y, heroDir * mp.dx >= 0, moving, timeNow, style, k) });
  });
  items.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawSigns();

  drawParticles();
  drawHud();
  drawHintBar();

  if (state === S.MAP) {
    const hidden = idx < STOPS.length && isMystery(STOPS[idx]);
    if (idx < STOPS.length && !hidden) lightLabel("NEXT: " + labelOf(STOPS[idx]), W - 6, H - 42, 1.5, "right");   // "NEXT: ???" says nothing, so it is dropped while hidden
    if (hidden) lightLabel(CONFIG.ui.promptEnter + " TO REVEAL", W - 6, H - 42, 1.5, "right");                      // ENTER reveals the hidden stop
    lightLabel(CONFIG.ui.promptSpace, W - 6, H - 22, 1.5, "right");                                                  // SPACE walks on (or finishes)
  }
}

function drawEnd() {
  drawMapScene();
  ctx.fillStyle = "rgba(10,8,18,0.62)"; ctx.fillRect(0, 0, W, H);
  text(CONFIG.endTitle, W / 2, 56, 3, "#ffffff", "center", "#d2051e");
  rect(W / 2 - 70, 86, 140, 2, "#d2051e");
  let y = 98;
  for (const raw of CONFIG.endLines)
    for (const l of wrap(raw, 26)) { text(l, W / 2, y, 2, "#f3f1ff", "center", "#000000"); y += 20; }
  text(CONFIG.ui.toolkitBar, W / 2, 130, 1, "#ffd95e", "center", "#1b1426");
  TOOL_KEYS.forEach((k, i) => {
    const x = W / 2 - 92 + i * 28, yy = 142;
    rect(x - 2, yy - 2, 20, 22, "rgba(255,255,255,0.12)");
    frame(x - 2, yy - 2, 20, 22, 1, "#f2b705");
    iconAt(k, x - 2, yy - 2, 20, 22);
  });
  if (Math.sin(timeNow * 3) > -0.4)
    lightLabel(CONFIG.endPrompt, W / 2, 172, 2, "center");
}

function drawParticles() {
  for (const p of parts) rect(p.x, p.y, 2, 2, p.col);
}

/* ------------------------------------------------------------------ loop -- */
let last = performance.now();
function tick(now) {
  let dt = (now - last) / 1000; last = now;
  const realDt = Math.max(0, dt);            // the countdown uses real time, even if the tab was throttled
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  if (!reduceMotion) timeNow += dt;          // frozen clock = no idle animation

  if (state === S.WALK) {
    walk.t += dt;
    const k = Math.min(1, walk.t / walk.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    heroT = walk.from + (walk.to - walk.from) * e;
    if (k >= 1) {
      heroT = walk.to;
      if (walk.back) { state = S.MAP; walk = null; }
      else {
        const i = walk.target; walk = null;
        idx = i + 1; flash = 0.22;
        burst(STOPS[i].x, STOPS[i].y - 10, "#cdd3de", 10);
        openCard(i);
      }
    }
  }
  if (card) card.anim += dt;
  if (card) {
    card.st += dt;
    const fs = STOPS[card.i];
    if (fs.finale && card.g) updateGlobe(dt, fs.finale);
    if (fs.finale && card.stage === 3 && !won[card.i] && card.st >= finaleTimes().land) {      // the hard hat lands on her head
      won[card.i] = true; flash = 0.3; burst(70, 56, "#ffd95e", 18); burst(70, 56, "#ffffff", 10);
    }
  }
  if (card) {
    card.t += dt;
    if (card.phase === 1) {
      const T = atkTimes();
      if (card.atk >= 0) {
        const before = card.atk;
        card.atk += dt;
        if (before < T.hit && card.atk >= T.hit) { burst(bossPt().x, bossPt().y, "#ffffff", 12); burst(bossPt().x, bossPt().y, "#f2b705", 6); }   // the blow lands
        if (card.atk >= T.dur) finishAttack();
      } else if (card.fade >= 0) { card.fade += dt; if (card.fade >= T.fade) winBattle(); }
    } else if (card.phase === 2 && STOPS[card.i].battle) {
      const T = toolTimes(), t0 = card.t - dt;
      dropSchedule(STOPS[card.i]).forEach(r => {
        if (t0 < r.at && card.t >= r.at) burst(bossPt().x, bossPt().y, "#ffd95e", 10);                        // pops out of the boss
        const arrive = r.at + toolDone();
        if (t0 < arrive && card.t >= arrive) burst(HUD_BAR.gx + TOOL_KEYS.indexOf(r.tool) * HUD_BAR.pitch + 6, 12, "#ffffff", 8);   // lands in the bar
      });
    }
  }
  if (flash > 0) flash -= dt;
  if (timerOn && state !== S.TITLE && state !== S.END) timeLeft = Math.max(0, timeLeft - realDt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    if (p.life <= 0 || p.y > H + 6) parts.splice(i, 1);
  }

  if (state === S.TITLE) drawTitle();
  else if (state === S.END) drawEnd();
  else { drawMapScene(); if (state === S.CARD) { drawCard(); drawParticles(); } }

  if (state !== S.TITLE) drawTimer();
  if (flash > 0 && !reduceMotion) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.5, flash * 1.6).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
